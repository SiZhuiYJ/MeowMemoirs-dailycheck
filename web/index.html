<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <!-- 首屏主题：在 CSS 和 Vue 之前先把 data-theme / 主题色写到 <html>，
       否则记住夜间模式或自定义色的用户会先看到一帧默认主题。
       逻辑与 src/composables/use-theme.ts 保持一致（存储键 "theme" / "themeColor"）。 -->
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var theme = saved === "dark" ? "dark" : "light";
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        if (theme === "dark") root.classList.add("dark");

        var savedColor = localStorage.getItem("themeColor");
        if (/^#[0-9a-f]{6}$/i.test(savedColor || "")) {
          root.style.setProperty("--theme-color", savedColor);
          var color = savedColor.slice(1);
          root.style.setProperty(
            "--theme-color-rgb",
            parseInt(color.slice(0, 2), 16) +
              ", " +
              parseInt(color.slice(2, 4), 16) +
              ", " +
              parseInt(color.slice(4, 6), 16),
          );
        }
      } catch (error) {
        /* 存储不可用时保持默认日间主题 */
        try {
          document.documentElement.setAttribute("data-theme", "light");
        } catch (nestedError) {
          /* documentElement 不可用：交给后续脚本 */
        }
      }
    })();
  </script>
  <!-- viewport-fit=cover：让页面铺满刘海屏/灵动岛，配合 env(safe-area-inset-*)
        （styles/responsive.scss 的 --safe-* 变量）把内容推回安全区内。 -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1.0" /> -->
  <title>%VITE_APP_TITLE%</title>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
